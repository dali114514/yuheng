<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>玉衡 v{{VERSION}} · 盘前分析</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png">
<link rel="apple-touch-icon" href="/brand/icon-256.png">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,0.10);
  --series-1: #2a78d6; --series-1-soft: rgba(42,120,214,0.12);
  --good: #006300; --good-mark: #0ca30c; --warning: #fab219; --critical: #d03b3b;
  --chip-bg: #f1f0ec;
  --cat-1: #2a78d6; --cat-2: #eb6834; --cat-3: #1baf7a; --cat-4: #eda100; --cat-5: #e87ba4; --cat-6: #008300; --cat-7: #6250d6;
  --div-pos: #2a78d6; --div-neg: #e34948; --div-mid: #f0efec;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
    --series-1: #3987e5; --series-1-soft: rgba(57,135,229,0.18);
    --good: #0ca30c; --good-mark: #0ca30c; --chip-bg: #242422;
    --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #0ca30c; --cat-7: #9085e9;
    --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,0.10);
  --series-1: #3987e5; --series-1-soft: rgba(57,135,229,0.18);
  --good: #0ca30c; --good-mark: #0ca30c; --chip-bg: #242422;
  --cat-1: #3987e5; --cat-2: #d95926; --cat-3: #199e70; --cat-4: #c98500; --cat-5: #d55181; --cat-6: #0ca30c; --cat-7: #9085e9;
  --div-pos: #3987e5; --div-neg: #e66767; --div-mid: #383835;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; }
main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 60px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 12px; margin-bottom: 14px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }

/* ---------- 盘前分析 ---------- */
main { max-width: 1400px; }
.legend { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; font-size: 12px; color: var(--muted); }
.legend .sw { display: inline-block; width: 26px; height: 12px; border-radius: 2px; vertical-align: -2px; }
#map { position: relative; width: 100%; height: 640px; border-radius: 10px; overflow: hidden; background: var(--grid); }
.tm { position: absolute; box-sizing: border-box; border: 1px solid var(--page); padding: 6px 8px; overflow: hidden; cursor: pointer;
  display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; color: #fff; transition: filter .12s; }
.tm:hover { filter: brightness(1.15); }
.tm .c { font-weight: 700; letter-spacing: .5px; line-height: 1.1; }
.tm .p { font-variant-numeric: tabular-nums; font-weight: 600; line-height: 1.2; }

.tm.dim { color: var(--ink-2); }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-start; justify-content: center; z-index: 20; overflow: auto; padding: 40px 12px; }
.modal.on { display: flex; }
.box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; width: min(1100px, 100%); padding: 18px 20px 22px; }

.pl { display: grid; grid-template-columns: 14px 1fr auto; gap: 6px 10px; align-items: center; font-size: 13px; }

td small { color: var(--muted); }

<body>
<main>
  <header>
    <h1 class="brand" title="玉衡：北斗第五星。衡是秤杆，权衡轻重、冷静决策。">
      <img class="seal" src="/brand/seal-128.png" alt="">
      <img class="mark ink" src="/brand/yuheng-ink.png" alt="玉衡">
      <img class="mark white" src="/brand/yuheng-white.png" alt="玉衡">
      <span class="brand-sub"><b>盘前分析 · 每只股票</b><small>YUHENG v{{VERSION}}</small></span>
    </h1>
    <span class="sub" id="updated"></span>
    <nav class="nav"><button id="reload">刷新</button><a href="/lib"><button>策略库</button></a><a href="/"><button>← 回控制台</button></a></nav>
  </header>

  <section class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:10px">
      <div class="legend" id="legend"></div>
      <div class="sub">块的大小 = 最近 20 天平均成交额；颜色 = <span id="chgword">盘前</span>涨跌（±3% 颜色最深）；点一块看详细。「名单」= 在今天纪律设置的观察名单里。</div>
    </div>
    <div id="map"><div class="empty" style="padding:16px">载入中…</div></div>
    <div class="warnline">如实说：「形态」要收盘后才知道。概率 = 这只股票历史上同样开盘类型的日子里各形态出现的比例（天数少时往全部股票的比例靠）；开盘类型主要改变「窄幅震荡」的多少，几乎不改变涨还是跌。每种形态下「最好的组合」是事后看的（知道今天会单边上涨，做多拿到收盘当然最好），只能帮你理解每种走势里什么打法吃亏、什么占便宜；真正能事先用的是下面「今天的建议」（按开盘类型挑，挑的时候不知道形态）。</div>
  </section>
</main>

<div class="modal" id="modal"><div class="box" id="box"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const pc = (v, d = 1) => v == null ? "—" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v * 100).toFixed(d) + "%";
const usd = v => v == null ? "—" : (v >= 0 ? "+$" : "−$") + Math.abs(Math.round(v)).toLocaleString();
const DTC = {trend_up: "var(--up)", trend_down: "var(--down)", spike_fade: "var(--cat-2)", dip_rally: "var(--cat-1)", range_wide: "var(--cat-4)", range_narrow: "var(--muted)"};
let D = null;

// ---------------- 方块热力图（squarified treemap）
function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((a, b) => a + b.v, 0);
  if (!items.length || total <= 0) return out;
  const scale = (w * h) / total;
  let rest = items.map(it => ({...it, a: it.v * scale}));
  let bx = x, by = y, bw = w, bh = h;
  while (rest.length) {
    const side = Math.min(bw, bh);
    let row = [], best = Infinity;
    for (const it of rest) {
      const r2 = [...row, it], s = r2.reduce((a, b) => a + b.a, 0);
      const worst = Math.max(...r2.map(r => Math.max((side * side * r.a) / (s * s), (s * s) / (side * side * r.a))));
      if (worst > best && row.length) break;
      row = r2; best = worst;
    }
    const s = row.reduce((a, b) => a + b.a, 0);
    if (bw >= bh) {                       // 竖着放一列
      const cw = s / bh; let yy = by;
      for (const r of row) { const hh = r.a / cw; out.push({...r, x: bx, y: yy, w: cw, h: hh}); yy += hh; }
      bx += cw; bw -= cw;
    } else {                              // 横着放一行
      const rh = s / bw; let xx = bx;
      for (const r of row) { const ww = r.a / rh; out.push({...r, x: xx, y: by, w: ww, h: rh}); xx += ww; }
      by += rh; bh -= rh;
    }
    rest = rest.slice(row.length);
  }
  return out;
}

function tileColor(chg) {
  if (chg == null) return "var(--chip-bg)";
  const k = Math.min(1, Math.abs(chg) / 3), pct = Math.round(25 + 70 * k);
  return `color-mix(in srgb, ${chg >= 0 ? "var(--up)" : "var(--down)"} ${pct}%, var(--surface))`;
}

function drawMap() {
  const host = $("#map");
  if (!D || D.missing) { host.innerHTML = `<div class="empty" style="padding:16px">${esc((D && D.msg) || "没有数据")}</div>`; return; }
  const W = host.getBoundingClientRect().width;
  if (W < 100) { requestAnimationFrame(drawMap); return; }          // 还没排好版：下一帧再画
  const H = Math.max(420, Math.min(720, Math.round(W * 0.5)));
  host.style.height = H + "px";
  const items = D.tiles.map(t => ({v: Math.sqrt(Math.max(t.size, 1)), t})).sort((a, b) => b.v - a.v);
  const rects = squarify(items, 0, 0, W, H);
  host.innerHTML = rects.map(r => {
    const t = r.t, big = Math.min(r.w, r.h), fs = Math.max(11, Math.min(34, big / 4.2));
    return `<div class="tm${t.chg == null ? " dim" : ""}" data-c="${esc(t.code)}" style="left:${r.x}px;top:${r.y}px;width:${r.w}px;height:${r.h}px;background:${tileColor(t.chg)}" title="${esc(t.code)} ${esc(t.name)}">
      ${t.in_plan ? '<span class="badge">名单</span>' : ""}
      <div class="c" style="font-size:${fs}px">${esc(t.code)}</div>
      ${big > 46 ? `<div class="p" style="font-size:${Math.max(11, fs * 0.8)}px">${t.chg == null ? "—" : (t.chg > 0 ? "+" : "") + t.chg.toFixed(2) + "%"}</div>` : ""}
      ${big > 80 ? `<div class="g">${esc(t.gap_name)}${t.gap != null ? ` · ${t.gap > 0 ? "+" : ""}${t.gap} ATR` : ""}</div>` : ""}</div>`;
  }).join("");
  host.querySelectorAll(".tm").forEach(el => el.onclick = () => openStock(el.dataset.c));
}

// ---------------- 点开：饼图 + 每种形态
function donut(parts) {
  const R = 110, r = 64, cx = 130, cy = 130;
  let a0 = -Math.PI / 2, paths = "";
  const tot = parts.reduce((a, b) => a + (b.p || 0), 0) || 1;
  for (const p of parts) {
    const frac = (p.p || 0) / tot, a1 = a0 + frac * Math.PI * 2, large = frac > 0.5 ? 1 : 0;
    const P = (rad, ang) => `${cx + rad * Math.cos(ang)},${cy + rad * Math.sin(ang)}`;
    if (frac > 0.0005) paths += `<path d="M${P(R, a0)} A${R},${R} 0 ${large} 1 ${P(R, a1)} L${P(r, a1)} A${r},${r} 0 ${large} 0 ${P(r, a0)} Z" fill="${DTC[p.id]}" stroke="var(--surface)" stroke-width="2"><title>${esc(p.name)} ${(frac * 100).toFixed(0)}%</title></path>`;
    a0 = a1;
  }
  return `<svg viewBox="0 0 260 260" width="260" height="260" role="img" aria-label="形态概率">${paths}
    <text x="130" y="124" text-anchor="middle" font-size="13" fill="var(--muted)">今天会走成</text>
    <text x="130" y="146" text-anchor="middle" font-size="13" fill="var(--muted)">哪种形态</text></svg>`;
}

function combo(x, rand) {
  if (!x) return '<span class="sub">样本不够</span>';
  return `${esc(x.name)} + ${esc(x.stop_name)} + ${esc(x.tgt_name)} <small>${x.n} 笔，每笔 ${pc(x.avg)}${rand != null ? `（随机最好 ${pc(rand)}）` : ""}</small>`;
}

function openStock(code) {
  const t = D.tiles.find(x => x.code === code); if (!t) return;
  const parts = t.probs.map(p => ({id: p.id, name: p.name, p: p.p}));
  const top = [...t.probs].sort((a, b) => (b.p || 0) - (a.p || 0))[0];
  const rec = t.rec.length ? t.rec.map(r => `<div><b class="${r.dir === "L" ? "l" : "s"}">${esc(r.dir_name)}</b>：${esc(r.name)} · 止损 ${esc(r.stop)} · 止盈 ${esc(r.tgt)} · ${esc(r.level)}
      <span class="sub">（回测每笔 样本内 ${pc(r.inn)} / 样本外 ${pc(r.out)}${r.loss != null ? `；止损一次每张约亏 $${r.loss}` : ""}）</span></div>`).join("")
    : `<div>今日预案在「${esc(t.gap_name)}」这种开盘下没给 ${esc(code)} 挑出组合：<b>不做</b>（要做先想清楚理由）。</div>`;
  $("#box").innerHTML = `
    <div class="top"><h2 style="margin:0">${esc(code)} <span class="sub">${esc(t.name)}</span></h2>
      <span>${t.px != null ? t.px.toFixed(2) : "—"} <b class="${(t.chg || 0) >= 0 ? "pos" : "neg"}">${t.chg == null ? "" : (t.chg > 0 ? "+" : "") + t.chg.toFixed(2) + "%"}</b></span>
      <span class="chip">${esc(t.gap_name)}${t.gap != null ? ` · 跳空 ${t.gap > 0 ? "+" : ""}${t.gap} 倍 ATR` : ""}</span>
      ${t.in_plan ? `<span class="chip">在今天的观察名单${t.strategy ? " · 已选策略" : ""}</span>` : ""}
      <button class="x" id="close">关闭</button></div>
    <div class="pieWrap">
      <div>${donut(parts)}</div>
      <div>
        <div class="pl">${t.probs.map(p => `<span class="sw" style="background:${DTC[p.id]}"></span><span>${esc(p.name)}</span><b>${p.p == null ? "—" : Math.round(p.p * 100) + "%"}</b>`).join("")}</div>
        <div class="sub" style="margin-top:8px">${esc(code)} 历史上「${esc(t.gap_name)}」的日子 ${t.n_days ?? 0} 天${(t.n_days || 0) < 60 ? "，天数少，概率往全部股票的比例靠了" : ""}。最常见：${esc(top.name)}（${Math.round((top.p || 0) * 100)}%）——也就是说，最可能的那种也只有这么多，别当成预测。</div>
      </div>
    </div>
    <div class="rec"><div class="sub" style="margin-bottom:4px">今天的建议（今日预案按「${esc(t.gap_name)}」挑的，挑的时候不知道形态；仓位建议：${esc(D.best_pos_name || "—")}，没看过的数据上回撤最小）</div>${rec}</div>
    <h3>每种形态下，回测里哪组最好（事后看）</h3>
    <div class="scroll"><table style="min-width:900px">
      <tr><th>如果今天走成</th><th class="num">概率</th><th>做多（CALL）最好的组合 · 全部股票</th><th>做空（PUT）最好的组合 · 全部股票</th><th>${esc(code)} 自己</th><th>仓位方案（这种形态里每笔最好）</th></tr>
      ${t.probs.map(p => `<tr>
        <td><span class="sw" style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${DTC[p.id]}"></span> <b>${esc(p.name)}</b></td>
        <td class="num">${p.p == null ? "—" : Math.round(p.p * 100) + "%"}</td>
        <td>${combo(p.long, p.rand && p.rand.L)}</td>
        <td>${combo(p.short, p.rand && p.rand.S)}</td>
        <td>多：${p.long_mine ? `${esc(p.long_mine.name)} <small>${pc(p.long_mine.avg)}，${p.long_mine.n} 笔</small>` : '<span class="sub">样本不够</span>'}<br>
            空：${p.short_mine ? `${esc(p.short_mine.name)} <small>${pc(p.short_mine.avg)}，${p.short_mine.n} 笔</small>` : '<span class="sub">样本不够</span>'}</td>
        <td>${p.sizing ? `${esc(p.sizing.name)} <small>每笔 ${usd(p.sizing.per_trade)}</small>` : "—"}</td></tr>`).join("")}
    </table></div>
    <div class="warnline">怎么看：同一种形态里，「最好的组合」如果和「随机最好」差不多，说明那种走势里怎么做都差不多，赚的是走势本身，不是打法。形态的分法：${esc(D.how || "")}<br>
      收益是每笔的权利金收益率（平值、约 3 天到期期权，模型估算，扣了价差）；仓位方案那一列是按开盘挑出的组合在这种形态里每笔赚亏多少美元（全部股票，按今天的权利金水平折算）。</div>`;
  $("#modal").classList.add("on");
  $("#close").onclick = () => $("#modal").classList.remove("on");
}
$("#modal").onclick = e => { if (e.target.id === "modal") $("#modal").classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape") $("#modal").classList.remove("on"); });

function legend() {
  $("#legend").innerHTML = `<span><span class="sw" style="background:${tileColor(-3)}"></span> −3%</span><span><span class="sw" style="background:${tileColor(-1)}"></span> −1%</span>
    <span><span class="sw" style="background:${tileColor(1)}"></span> +1%</span><span><span class="sw" style="background:${tileColor(3)}"></span> +3%</span>`;
}

async function load(force) {
  try {
    const r = await fetch("/api/pre" + (force ? "?force=1" : ""), {cache: "no-store"});
    D = await r.json();
  } catch (e) { D = {missing: true, msg: "读取失败：" + e.message}; }
  if (D && !D.missing) {
    $("#updated").textContent = `${D.day} · ${D.state} · ${D.at} 更新${D.qnote ? " · " + D.qnote : ""}`;
    $("#chgword").textContent = D.state === "盘中" ? "今天" : D.state === "盘后" ? "今天收盘" : "盘前 / 夜盘";
  }
  legend(); requestAnimationFrame(drawMap);
}
$("#reload").onclick = () => load(true);
let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(drawMap, 150); });
load();
setInterval(() => { if (!$("#modal").classList.contains("on")) load(); }, 60000);
</script>
</body>
</html>
