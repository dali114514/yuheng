# ============================================================
#  期权价差机器人配置（规则来自「期权坤哥」系列视频，见 README）
#  改完保存即可，下次运行生效。
# ============================================================

[connection]
host = "127.0.0.1"      # OpenD 所在地址，本机就是 127.0.0.1
port = 11112            # 你的 moomoo 设置 → 外部接口 → 程序开发(TCP) 端口
security_firm = "FUTUAU"  # 澳洲 moomoo 账户 = FUTUAU，不要改

[cli]
# moomoo CLI（行情 + 模拟账户都走它，不需要 OpenD）
path = '%LOCALAPPDATA%\MoomooCLI\bin\moomoo.exe'
# 模拟账户 ID：运行 moomoo sim account list 查看，用 "US Margin Account [Paper Trading]" 那个
sim_account = "YOUR_SIM_ACCOUNT"

[account]
# 每笔交易最多花多少「美元」（含手续费）。
# 注意：50 澳元换成美元大约只有 30 多美元，按实际到账的美元填。
budget_usd = 30.0
# 每张期权合约的手续费估算（美元，开仓+平仓各算一次）。
# 去 moomoo app「我的 → 费用说明」查美股期权的真实费率后改这里。
fee_per_contract = 1.0
# 同一时间最多持有几组价差（坤哥的「三三原则」是最多 3 组，50 块只够 1 组）
max_open_positions = 1

[universe]
# 只做流动性最好的宽基 ETF（视频：标的流动性是第一条）
underlyings = ["US.SPY", "US.QQQ"]

[signal]
# 均线 / RSI 参数（视频：散户只看 MA 和 RSI 两个指标）
rsi_period = 14
rsi_oversold = 35       # RSI 低于这个 → 超卖，看涨（牛市价差）
rsi_overbought = 65     # RSI 高于这个 → 超买，看跌（熊市价差）
trend_ma = 120          # MA120 = 牛熊分界线

[selection]
# 到期日：视频建议买方别买两周内的，价差选 45-60 DTE
min_dte = 30
max_dte = 60
target_dte = 45
# 买入那条腿的 |Delta| 范围（平值到浅虚值）
long_delta_min = 0.25
long_delta_max = 0.55
max_width = 5.0          # 两个行权价最大间距（美元）
min_open_interest = 100  # 持仓量太小的合约不碰
max_leg_spread_pct = 0.25  # 单腿买卖价差 / 中间价 超过这个比例就不碰
min_reward_risk = 1.0    # 最大盈利 / 最大亏损 至少 1:1
budget_on_worst = true   # 预算按对手价（实际成交价）算，而不是中间价
strike_window_pct = 0.08 # 只看现价 ±8% 以内的行权价

[exit]
take_profit_frac = 0.5   # 赚到最大盈利的 50% 就平仓
stop_loss_frac = 0.5     # 价差价值跌掉 50% 就止损
exit_dte = 14            # 剩 14 天到期就平仓（避开最后两周 Theta 加速）

[discipline]
# ---- 纪律锁（运行 run.py lock 之后，这整个文件都不能再改）----
lock_days = 30                # 一次锁定多少天
unlock_cooldown_hours = 72    # 申请提前解锁后，要等多少小时才生效
max_total_loss_usd = 28.0     # 累计已实现亏损达到这个数 → 熔断，不再开新仓
max_consecutive_losses = 2    # 连续亏几笔就暂停
pause_days_after_streak = 5   # 暂停几天
check_manual_trades = true    # 券商持仓和机器人记录不一致 → 停止开新仓

[execution]
# 只在美东时间这个窗口内下单（避开开盘、收盘前 15 分钟的剧烈波动）
trade_start_et = "09:45"
trade_end_et = "15:45"
# 限价单挂多久没成交就撤单（分钟）
cancel_after_min = 30
# auto 模式每隔多少分钟检查一次
loop_interval_min = 15
# 实盘下单前是否必须在终端手动输入 YES 确认。
# 改成 false = 无人值守实盘：程序自己开平仓，你不用守着。只有在 run.py lock 锁定规则后才允许。
require_confirm_live = true
